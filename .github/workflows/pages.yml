name: Deploy Tarot Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/cards _site/simple _site/assets
          cp animated/index.html _site/index.html
          cp -R assets/generated assets/oracle assets/lenormand _site/assets/
          cp cards/*.webp _site/cards/
          cp cards/SOURCE.txt _site/cards/SOURCE.txt
          cp simple/index.html _site/simple/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/simple/index.html
          test "$(find _site/assets/generated -type f -name '*.webp' | wc -l)" -eq 3
          test "$(find _site/assets/oracle -type f -name '*.webp' | wc -l)" -eq 44
          test "$(find _site/assets/lenormand -type f -name '*.webp' | wc -l)" -eq 36
          test "$(find _site/cards -type f -name '*.webp' | wc -l)" -eq 78

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

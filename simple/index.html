<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>隨機塔羅 · 78 張牌</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b19;color:#ece8dc;font-family:system-ui,sans-serif;min-height:100vh}main{max-width:1080px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;color:#b5bdaa;font-size:13px;letter-spacing:2px;border-bottom:1px solid #34443b;padding-bottom:22px}.hero{text-align:center;padding:55px 0 30px}.star{font-size:42px;color:#c7b580}h1{font-family:serif;font-size:clamp(32px,6vw,52px);font-weight:400;margin:15px 0}p{color:#b5bdae;line-height:1.8}.panel{background:#1b2924;border:1px solid #3d4b3a;border-radius:18px;padding:28px;max-width:580px;margin:0 auto 42px}label{display:block;font-size:19px;margin-bottom:16px}.controls{display:flex;gap:12px}input{width:110px;background:#111b19;border:1px solid #647359;border-radius:9px;padding:13px;color:#fff;font:inherit}button{flex:1;background:#d8c895;border:0;border-radius:9px;font:inherit;color:#20291f;padding:14px;cursor:pointer}button:hover{background:#eadbae}button:focus-visible,input:focus-visible{outline:3px solid #ece8dc;outline-offset:3px}.note{font-size:13px;margin-bottom:0}#error{color:#ffc8b5;min-height:20px;font-size:14px;margin:10px 0 0}.resulthead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.resulthead h2{font-size:20px;font-weight:400}.tag{font-size:12px;color:#b5bdae}#summary{display:block;width:100%;background:#1b2924;border:1px solid #647359;border-radius:9px;padding:14px;color:#ece8dc;font:inherit;line-height:1.9;resize:vertical;white-space:pre-wrap}#resultText{margin-bottom:24px}#copyResults{margin-top:12px}#copyStatus{font-size:13px;min-height:20px}[hidden]{display:none!important}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:18px}.card{border:1px solid #7c805c;border-radius:12px;padding:12px;background:#22342b;text-align:center;animation:arrive .35s ease-out}.art{border:1px solid #5e7050;border-radius:8px;height:170px;display:grid;place-content:center;gap:8px;background:radial-gradient(ellipse at center,#3c4e34,#18281f);color:#d8c895}.symbol{font-size:55px;line-height:1.2}.number{font-family:serif;font-size:15px;letter-spacing:3px}.reversed .art{transform:rotate(180deg)}.card h3{font-size:17px;font-weight:500;margin:18px 0 5px}.position{font-size:13px;color:#d8c895;padding-bottom:7px}.order{font-size:11px;color:#b5bdae;margin-top:8px}#empty{text-align:center;padding:20px 0 50px;color:#809181}footer{text-align:center;border-top:1px solid #34443b;margin-top:48px;padding-top:22px;color:#829381;font-size:12px}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.card{animation:none}}@media(max-width:480px){main{padding:25px 18px}.hero{padding:35px 0 20px}.panel{padding:22px}#cards{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:150px}}
</style></head><body><main><header><span>✧ 隨機塔羅</span><span>78 CARDS</span></header><div class="hero"><div class="star" aria-hidden="true">☾</div><h1>此刻，抽一張未知。</h1><p>完整 78 張塔羅牌。每一輪，都係全新開始。</p></div><form class="panel" id="drawForm"><label for="count">今輪想抽幾多張牌？</label><div class="controls"><input id="count" type="number" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go" min="1" max="78" step="1" required placeholder="1–78" aria-describedby="error note"><button type="submit">洗牌 · 抽牌 ↗</button></div><p id="error" role="alert"></p><p class="note" id="note">可以抽 1–78 張 · 同輪唔重複 · 正逆位各 50%</p></form><section aria-live="polite" aria-atomic="true"><div class="resulthead"><h2 id="heading">你嘅牌</h2><span class="tag" id="round">尚未抽牌</span></div><div id="empty">✧ 揀好張數，開始今次抽牌。</div><div id="resultText" hidden><textarea id="summary" readonly aria-label="今輪抽牌文字結果" rows="3" spellcheck="false"></textarea><button type="button" id="copyResults">複製結果</button><p id="copyStatus" role="status"></p></div><div id="cards"></div></section><footer>22 張大阿爾克那 + 56 張小阿爾克那 · 每輪重新洗牌</footer></main><script>const majors=['愚者','魔術師','女祭司','皇后','皇帝','教皇','戀人','戰車','力量','隱者','命運之輪','正義','吊人','死神','節制','惡魔','高塔','星星','月亮','太陽','審判','世界'];
const ranks=['一','二','三','四','五','六','七','八','九','十','侍者','騎士','皇后','國王'];
const suits=[['權杖','✦'],['聖杯','♧'],['寶劍','⚔'],['錢幣','◉']];
const deck=[...majors.map((name,i)=>({name,symbol:'✧',number:String(i).padStart(2,'0')})),...suits.flatMap(([suit,symbol])=>ranks.map((rank,i)=>({name:suit+rank,symbol,number:String(i+1).padStart(2,'0')})))];
function randomInt(n){const buffer=new Uint32Array(1);const limit=4294967296-(4294967296%n);do{crypto.getRandomValues(buffer)}while(buffer[0]>=limit);return buffer[0]%n}
function draw(count){if(!Number.isInteger(count)||count<1||count>78)throw new RangeError('請輸入 1 至 78 嘅整數。');const shuffled=deck.slice();for(let i=shuffled.length-1;i>0;i--){const j=randomInt(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}return shuffled.slice(0,count).map(card=>({...card,reversed:randomInt(2)===1}))}
let round=0;
document.getElementById('drawForm').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('count');const error=document.getElementById('error');try{const result=draw(Number(input.value));error.textContent='';const summary=document.getElementById('summary');summary.value=result.map((card,i)=>(i+1)+'. '+card.name+'（'+(card.reversed?'逆位':'正位')+'）').join('\n');summary.rows=Math.min(12,result.length);document.getElementById('resultText').hidden=false;document.getElementById('copyStatus').textContent='';const cards=document.getElementById('cards');cards.replaceChildren();result.forEach((card,i)=>{const article=document.createElement('article');article.className='card'+(card.reversed?' reversed':'');article.innerHTML='<div class="art" aria-hidden="true"><span class="number">'+card.number+'</span><span class="symbol">'+card.symbol+'</span></div><div class="order">第 '+(i+1)+' 張</div><h3>'+card.name+'</h3><div class="position">'+(card.reversed?'↓ 逆位':'↑ 正位')+'</div>';cards.append(article)});document.getElementById('empty').hidden=true;document.getElementById('heading').textContent='今輪抽到 '+result.length+' 張牌';document.getElementById('round').textContent='第 '+(++round)+' 輪';input.value='';input.focus()}catch(err){error.textContent=err.message}});
document.getElementById('copyResults').addEventListener('click',async()=>{
const summary=document.getElementById('summary');
const status=document.getElementById('copyStatus');
if(!summary.value)return;
try{
if(!navigator.clipboard || !navigator.clipboard.writeText)throw new Error('Clipboard unavailable');
await navigator.clipboard.writeText(summary.value);
status.textContent='已複製，包含每張牌嘅換行。';
}catch(error){
summary.focus();summary.select();summary.setSelectionRange(0,summary.value.length);
let copied=false;
try{copied=document.execCommand('copy')}catch(error){}
status.textContent=copied?'已複製，包含每張牌嘅換行。':'已選取全部結果，請長按文字框並選「複製」。';
}
});
</script></body></html>
